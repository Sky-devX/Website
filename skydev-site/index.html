<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyDev</title>
<meta name="description" content="SkyDev: Programme, Tools und Webseiten zum Herunterladen.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <a class="logo" href="#/start" aria-label="SkyDev Startseite">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2" opacity=".25"/><path d="M9 19l5-5-5-5M16 22h7" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Sky<span>Dev</span>
    </a>
    <div class="dd" id="ddMenu"></div>
    <a class="navlink" id="navCal" href="#/kalender">Kalender</a>
    <div class="dd right" id="ddContact"></div>
    <button class="theme" id="theme" type="button" aria-label="Hell oder dunkel umschalten">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<footer>
  <div class="wrap">
    <span id="copy"></span>
    <span><a href="#/impressum">Impressum</a></span>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px">Diese Seite braucht JavaScript.</p></noscript>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
